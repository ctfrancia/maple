services:
  database:
    image: postgres:18.0
    container_name: database
    ports:
      # - "5432:5432" # shouldn't be exposed since we're using docker-compose
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./database-data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/pg_hba.conf
    command: ["-c", "hba_file=/etc/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpu_count: 2

  backend:
    image: localhost/maple/maple:0.0.1
    pull_policy: never
    container_name: maple
    ports:
      - "8080:8080"
      - "4000:4000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - MAPLE_AUTH_HOST=http://auth:6000 
    depends_on:
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  metrics:
    image: localhost/maple/metrics:0.0.1
    pull_policy: never
    container_name: metrics
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4010:4010"
      - "4020:4020"
    cpus: 1
    environment:
      - GOMAXPROCS=1
      - METRICS_COLLECT_FROM=http://maple:3010/debug/vars
    networks:
      sales-system-network:
        ipv4_address: 10.5.0.20
    depends_on:
      - maple

  auth:
    image: localhost/maple/auth:0.0.1
    pull_policy: never
    container_name: auth
    ports:
     # - "8081:8080"
    expose:
      - 6000
    environment:
      - AUTH_DB_HOST=database
      - AUTH_DB_USER=${POSTGRES_USER}
      - AUTH_DB_PASSWORD=${POSTGRES_PASSWORD}
      - AUTH_DB_NAME=${POSTGRES_DB}
      - AUTH_JWT_SECRET=secret
      - AUTH_JWT_EXPIRATION=3600
      - AUTH_JWT_ISSUER=maple
    networks:
      maple-system-network:
        ipv4_address: 10.5.0.10
    depends_on:
      - database
      
