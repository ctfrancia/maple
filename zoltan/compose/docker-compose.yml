services:
  database:
    image: postgres:18.0
    container_name: database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    image: maple/backend:${VERSION:-latest}
    container_name: maple
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - MAPLE_AUTH_HOST=http://auth:6000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
      database:
        condition: service_healthy
      tempo:
        condition: service_started

  auth:
    image: maple/auth:${VERSION:-latest}
    container_name: auth
    environment:
      - AUTH_DB_HOST=database
      - AUTH_DB_USER=${POSTGRES_USER}
      - AUTH_DB_PASSWORD=${POSTGRES_PASSWORD}
      - AUTH_DB_NAME=${POSTGRES_DB}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_JWT_EXPIRATION=3600
      - AUTH_JWT_ISSUER=maple
    depends_on:
      database:
        condition: service_healthy

  metrics:
    image: maple/metrics:${VERSION:-latest}
    container_name: metrics
    environment:
      - GOMAXPROCS=1
      - METRICS_COLLECT_FROM=http://backend:3010/debug/vars
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
      - '--enable-feature=exemplar-storage'
    depends_on:
      - backend

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    ports:
      - "3200:3200" # Tempo UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./tempo.yml:/etc/tempo.yml
      - tempo-data:/var/tempo
    command: 
      - '-config.file=/etc/tempo.yml'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3300:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki


volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
  loki-data:
